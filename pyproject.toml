[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miseport"
version = "0.1.0"
description = "Read-only Japanese merchant catalog tools for agent commerce"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp==1.28.0", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
miseport = "miseport.cli:main"
miseport-mcp = "miseport.server:main"
miseport-http = "miseport.http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
