name: release-clean-source
on:
  push:
    branches:
      - 'release/merchant-v0.1-clean-source'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject internal files from the GitHub source tag
        run: python scripts/release_preflight.py
      - name: Confirm synthetic test suite and public Python package
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest -q
          python -m build
          python scripts/verify_distribution.py
      - name: Explain acceptance not yet proven
        run: |
          echo "CLEAN SOURCE != MERCHANT RELEASE APPROVAL"
          echo "A consented real shop, Windows end-user acceptance and remote MCP are separate gates."
