name: local-contract
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/check_site.py
      - run: python -m build
      - run: python scripts/verify_distribution.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t miseport:ci .
      - run: docker run --rm --entrypoint miseport miseport:ci validate /app/examples/products.json
      - run: docker build -f Dockerfile.http -t miseport-http:ci .
      - run: docker run --rm --entrypoint miseport-http miseport-http:ci --help
  cloudflare-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MISEPORT_PUBLIC_ORIGIN: https://miseport.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install fixed pnpm
        run: npm install --global pnpm@11.25.0 --no-audit --no-fund --loglevel=error
      - name: Generate Python-validated catalog and contracts
        run: |
          python -m pip install --quiet -e ".[dev]"
          python scripts/build_cloudflare_demo.py
      - name: Worker unit and Python parity tests
        run: node --test cloudflare/test_worker.mjs
      - name: Install locked build dependencies with bounded failure output
        shell: bash
        run: |
          test "$(pnpm --version)" = "11.25.0"
          if ! pnpm --dir cloudflare install --frozen-lockfile --reporter=append-only > "$RUNNER_TEMP/miseport-pnpm-install.log" 2>&1; then
            tail -n 80 "$RUNNER_TEMP/miseport-pnpm-install.log"
            exit 1
          fi
          test "$(pnpm --dir cloudflare exec esbuild --version)" = "0.28.2"
      - name: Build and package Pages Advanced Mode
        run: |
          pnpm --dir cloudflare run build:pages
          python scripts/package_cloudflare_pages.py
      - name: Check bundled Worker and upload ZIP without deployment
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const {default: worker} = await import('./cloudflare/public/_worker.js');
          const response = await worker.fetch(new Request('https://miseport.pages.dev/healthz'), {});
          assert.equal(response.status, 200);
          assert.equal((await response.json()).demo, true);
          console.log('Bundled Pages Worker readiness passed; no network request made.');
          JS
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('artifacts/cloudflare-pages/miseport-pages.zip') as archive:
              names = set(archive.namelist())
              assert {'index.html', '_worker.js', 'privacy.html', 'terms.html', 'docs/index.html'} <= names
              assert not any(set(name.split('/')) & {'node_modules', '.wrangler', '.git'} for name in names)
          print('Pages upload ZIP has static files and Advanced Mode Worker, without local dependencies.')
          PY

  agent-eval-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tested read-only MCP stack
        run: python -m pip install -e ".[dev]"
      - name: Capture real local MCP protocol evidence (synthetic 20 probes)
        run: |
          mkdir -p artifacts/agent-eval
          miseport-eval protocol --output artifacts/agent-eval/local-protocol.json
          python -m json.tool artifacts/agent-eval/local-protocol.json > /dev/null
      - name: Upload protocol evidence (NOT Agent answers)
        uses: actions/upload-artifact@v7
        with:
          name: miseport-synthetic-mcp-20-probes
          path: artifacts/agent-eval/local-protocol.json
          if-no-files-found: error
          retention-days: 7

  discovery-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tested Python package
        run: python -m pip install -e ".[dev]"
      - name: Generate synthetic discovery and webpage evidence only (offline)
        run: |
          mkdir -p artifacts/discovery
          miseport-discovery-readiness \
            --catalog tests/fixtures/demo-store.reference.json \
            --profile examples/discovery-profile.example.json \
            --output artifacts/discovery/readiness.json
          miseport-web-discovery-audit \
            --catalog tests/fixtures/demo-store.reference.json \
            --offline-manifest examples/discovery-web-evidence.demo.json \
            --output artifacts/discovery/web-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/discovery")
          readiness = json.loads((root / "readiness.json").read_text())
          web = json.loads((root / "web-audit.json").read_text())
          assert readiness["catalog_product_count"] == 2
          assert readiness["agent_discovery_verified"] is False
          assert readiness["channel_submission_performed"] is False
          assert web["checked"] == 1 and web["with_issues"] == 0
          assert web["agent_natural_discovery_verified"] is False
          print("Offline synthetic discovery evidence verified; no site or feed access.")
          PY
      - name: Upload synthetic diagnostics only
        uses: actions/upload-artifact@v7
        with:
          name: miseport-synthetic-discovery-preflight
          path: artifacts/discovery/*.json
          if-no-files-found: error
          retention-days: 7
