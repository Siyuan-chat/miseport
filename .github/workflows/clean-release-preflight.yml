name: clean-release-preflight
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify internal docs/old brand assets are absent from tag source
        run: python scripts/release_preflight.py
      - name: Verify all public Markdown relative links
        run: python scripts/check_release_links.py
      - name: Verify actual source distribution allowlist
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m build
          python scripts/verify_distribution.py
      - name: Summary of candidate scope
        run: |
          echo "Release preflight verifies file exclusion and links only."
          echo "It does NOT approve merchant functionality, permissions, branding, Windows UX or public demo."
