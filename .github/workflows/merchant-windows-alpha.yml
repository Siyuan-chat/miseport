name: merchant-windows-alpha
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-alpha:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tested runtime and PyInstaller
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "pyinstaller==6.22.3"
      - name: Test import and CLI version without desktop display
        run: |
          python -m miseport.gui --version
          python -m pytest -q tests/test_base_v2.py tests/test_base_urls.py tests/test_gui.py tests/test_publisher.py tests/test_platform_csv.py
      - name: Build unsigned alpha EXE without internal development documents
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name MisePort --collect-data miseport scripts/launch_gui.py
          if (!(Test-Path "dist/MisePort.exe")) { throw "Missing EXE" }
          Get-Item dist/MisePort.exe | Select-Object Length, Name | Format-Table
          Get-FileHash -Algorithm SHA256 dist/MisePort.exe | Format-List
        shell: pwsh
      - name: Launch the actual packaged Windows GUI (offline smoke test)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'miseport-gui-startup.json'
          $exe = (Resolve-Path 'dist/MisePort.exe').Path
          $arguments = '--smoke-test "' + $report + '"'
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill($true)
            throw "Packaged MisePort.exe did not complete its GUI startup check."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged MisePort.exe failed with exit code $($process.ExitCode)."
          }
          if (!(Test-Path -LiteralPath $report)) {
            throw 'Packaged GUI did not create its offline startup report.'
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok' -or $result.scope -ne 'packaged_gui_startup_only') {
            throw 'Packaged GUI startup checks failed.'
          }
          if ($result.network_used -ne $false -or $result.merchant_credentials_used -ne $false) {
            throw 'Offline smoke test unexpectedly claims real merchant or network usage.'
          }
          foreach ($check in $result.checks.PSObject.Properties) {
            if ($check.Value -ne $true) {
              throw "Packaged GUI check failed: $($check.Name)"
            }
          }
          Write-Host "Packaged Windows Tk GUI initialization passed (offline, no merchant acceptance)."
      - name: Prepare explicit alpha warning (not a production release)
        run: |
          @'
          MisePort Merchant GUI - ALPHA build for testing only.
          This is NOT the November 10 merchant-accepted release.
          BASE API read-only with owner-managed PAT; token is not persisted.
          BASE/Shopify product CSV read-only import is an alpha prototype and requires merchant review.
          Public product URLs must be confirmed by the merchant.
          Never enter PAT in https://miseport.pages.dev or public GitHub Issues.
          Cloudflare hosting requires a separate merchant-owned account.
          Windows installer signing and real shop acceptance are pending.
          '@ | Set-Content -Encoding UTF8 dist/README-ALPHA.txt
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: miseport-windows-alpha
          path: |
            dist/MisePort.exe
            dist/README-ALPHA.txt
          if-no-files-found: error
          retention-days: 7
