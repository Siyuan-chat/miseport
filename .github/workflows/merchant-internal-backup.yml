name: merchant-internal-backup-once
on:
  push:
    branches:
      - 'feat/merchant-gui-walkthrough'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create checked archive of tracked files slated for release exclusion
        env:
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from hashlib import sha256
          from pathlib import Path
          import json,os,subprocess,sys,zipfile
          sys.path.insert(0,"scripts")
          from audit_release import INTERNAL_FILES,INTERNAL_PREFIXES,SENSITIVE
          from release_preflight import OLD_ASSETS,OLD_PREFIXES
          root=Path.cwd()
          tracked=subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          files=sorted(p for p in tracked if p and
              (p in INTERNAL_FILES or p in OLD_ASSETS or
               any(p.startswith(x) for x in (*INTERNAL_PREFIXES,*OLD_PREFIXES))))
          # Only already-public files from this repository, not runtime secrets.
          suspicious=[]
          for name in files:
              p=root/name
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("Missing/unsafe tracked path: "+name)
              if SENSITIVE.search(p.read_bytes()):
                  suspicious.append(name)
          if suspicious:
              raise SystemExit("Possible secrets detected; abort external backup artifact: "+
                               ",".join(suspicious))
          out=root/"artifacts/internal-backup"
          out.mkdir(parents=True,exist_ok=True)
          dest=out/"miseport-internal-snapshot-20261029.zip"
          sha=subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()
          manifest={"source_commit":sha,"created_at":datetime.now(timezone.utc).isoformat(),
                    "note":"Already-public Git history; archive is NOT automatically private.",
                    "files":[]}
          with zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  data=(root/name).read_bytes()
                  archive.writestr(name,data)
                  manifest["files"].append({"path":name,"sha256":sha256(data).hexdigest(),
                                            "size_bytes":len(data)})
              archive.writestr("INTERNAL_BACKUP_MANIFEST.json",
                               json.dumps(manifest,ensure_ascii=False,indent=2))
          print("Preserved",len(files),"files from",sha[:12],
                "archive sha256",sha256(dest.read_bytes()).hexdigest())
          PY
      - name: Make the backup downloadable to the repository owner
        uses: actions/upload-artifact@v7
        with:
          name: miseport-internal-backup-20261029
          path: artifacts/internal-backup/miseport-internal-snapshot-20261029.zip
          if-no-files-found: error
          retention-days: 7
